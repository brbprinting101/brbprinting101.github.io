<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRB Printing | 3D Printing & CAD Engineering</title>
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: #0d0d0d;
            --card-border: #1f1f1f;
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.4);
            --text-main: #f5f5f5;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.18) 0%, transparent 70%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            overflow-x: hidden;
            padding: 20px;
        }

        header {
            padding: 5rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }

        .brand-tag {
            color: var(--neon-red);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: block;
            text-shadow: 0 0 10px var(--neon-red-glow);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        h1 span {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red-glow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--neon-red);
            color: #ffffff;
            padding: 0.9rem 2.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 0, 60, 0.4);
            transition: all 0.3s ease;
            border: 1px solid var(--neon-red);
        }

        .btn:hover {
            background-color: #d60032;
            box-shadow: 0 15px 35px rgba(255, 0, 60, 0.7);
            transform: translateY(-3px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--neon-red) 0%, transparent 100%);
        }
