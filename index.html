<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRB Printing | 3D Printing & CAD Engineering</title>
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: #0d0d0d;
            --card-border: #1f1f1f;
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.4);
            --text-main: #f5f5f5;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.18) 0%, transparent 70%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            overflow-x: hidden;
        }

        header {
            padding: 6rem 2rem 4rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            position: relative;
            perspective: 1000px;
        }

        .brand-tag {
            color: var(--neon-red);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: block;
            text-shadow: 0 0 10px var(--neon-red-glow);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            transform: translateZ(20px);
        }

        h1 span {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red-glow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--neon-red);
            color: #ffffff;
            padding: 0.9rem 2.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 0, 60, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--neon-red);
            transform-style: preserve-3d;
        }

        .btn:hover {
            background-color: #d60032;
            box-shadow: 0 15px 35px rgba(255, 0, 60, 0.7);
            transform: translateY(-4px) scale(1.03) translateZ(10px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--neon-red) 0%, transparent 100%);
        }

        /* 3D About Box */
        .about-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--neon-red);
            border-radius: 8px;
            padding: 2.5rem;
            margin-bottom: 4rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .about-box:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(-1deg);
            box-shadow: 0 30px 60px rgba(255, 0, 60, 0.15), 0 0 20px rgba(0,0,0,0.9);
            border-color: rgba(255, 0, 60, 0.4);
        }

        .about-box p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        .about-box p strong {
            color: var(--text-main);
        }

        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
        }

        .highlight-item {
            background: #080808;
            padding: 1.25rem;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .highlight-item:hover {
            border-color: var(--neon-red);
            transform: translateZ(15px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .highlight-item h4 {
            color: var(--neon-red);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .highlight-item p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        /* 3D Showcase Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            perspective: 1000px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease, border-color 0.4s ease;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .card:hover {
            border-color: var(--neon-red);
            transform: translateY(-10px) rotateX(4deg) rotateY(-2deg) scale(1.02);
            box-shadow: 0 25px 50px rgba(255, 0, 60, 0.25), 0 0 15px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #111111;
            display: block;
            border-bottom: 1px solid var(--card-border);
            transition: transform 0.4s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.25rem;
            background-color: var(--card-bg);
            position: relative;
            z-index: 2;
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 3D Holographic Viewer Styles */
        .holo-viewport {
            background: #080808;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 800px;
            cursor: grab;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        }

        .holo-viewport:active {
            cursor: grabbing;
        }

        .holo-tag {
            position: absolute;
            top: 1rem;
            left: 1.5rem;
            font-size: 0.75rem;
            color: var(--neon-red);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .holo-subtag {
            position: absolute;
            bottom: 1rem;
            right: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* 3D Object Assembly */
        .cube-3d {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
            transition: transform 0.1s linear;
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
